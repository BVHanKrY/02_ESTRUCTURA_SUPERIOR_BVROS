<!--
    SIN reproductor local y SIN <audio> local:
    el reproductor global (player.js vía shell.js)
    es el ÚNICO del ecosistema.
    (Excepción PCD-2: la previsualización de pistas

-->

<script type="module" src="assets/js/shell.js"></script>
<script type="module" src="assets/js/gate.js"></script>

<script type="module">

/* =========================================================
   BVROS STREAM — SOLO CATÁLOGO
   La reproducción vive 100% en el reproductor global.
   Si esta página se abriera sin shell, importa
   player.js directamente: mismo reproductor único.

   PCD-2: las pistas publicadas desde el PANEL DEL
   DUEÑO se fusionan ARRIBA del listado, con bloqueo
   por nivel y previsualización. Si la función falla,
   el catálogo estático sigue cargando igual.
========================================================= */

const SHELL_ACTIVE =
    !!window.__BVROS_SHELL__;


/*
   STANDALONE (sin shell):
   crear el reproductor global aquí mismo.
*/

if(!SHELL_ACTIVE){

    try{

        const m =
            await import('./assets/js/player.js');

        window.BVrosPlayer =
            m.default;

        window.dispatchEvent(
            new CustomEvent('bvros:playerready')
        );

    }catch(error){

        console.warn(
            '[BVros Stream] No se pudo crear el reproductor.',
            error
        );

    }

}

import { BVrosAuth } from './assets/js/services/auth-service.js';
import './assets/js/gate.js';
import './assets/js/bvlux.js';

/* =========================================================
   ANALYTICS
========================================================= */

let analyticsModule = null;

try{

    analyticsModule =
        await import(
            './assets/js/modules/analytics.js'
        );

}catch(error){

    console.warn(
        '[BVros] analytics.js no disponible — modo local.'
    );

}


const analyticsService = analyticsModule
    ? {

        registerPlay:
            analyticsModule.registerPlay,

        getPlayCount:
            analyticsModule.getPlayCount,

        toggleLike:
            analyticsModule.toggleLike,

        isLiked:
            analyticsModule.isLiked

    }
    : (() => {

        const LIKES_KEY =
            'bvros_likes_v2';

        const readLikes = () => {

            try{

                return JSON.parse(
                    localStorage.getItem(LIKES_KEY) || '{}'
                );

            }catch{

                return {};

            }

        };

        return {

            async registerPlay(){},
            async getPlayCount(){ return 0; },

            async toggleLike(trackId){

                const likes =
                    readLikes();

                const liked =
                    !!likes[trackId];

                if(liked){
                    delete likes[trackId];
                }else{
                    likes[trackId] = true;
                }

                localStorage.setItem(
                    LIKES_KEY,
                    JSON.stringify(likes)
                );

                return !liked;

            },

            isLiked(trackId){
                return !!readLikes()[trackId];
            }

        };

    })();


/* =========================================================
   ELEMENTOS
========================================================= */

const list =
    document.getElementById('track-list');


/* =========================================================
   ESTADO
========================================================= */

let tracks = [];

let currentIndex = -1;

let currentSlug = null;


/* Totales de PLAYS desde la nube (sin destello):
   caché de nube para pintar al instante. */

const CLOUD_CACHE_KEY =
    'bvros_cloud_plays_v1';

let playCounts = (() => {

    try{

        return JSON.parse(
            localStorage.getItem(CLOUD_CACHE_KEY) || '{}'
        );

    }catch{

        return {};

    }

})();


function saveCloudCache(){

    try{

        localStorage.setItem(
            CLOUD_CACHE_KEY,
            JSON.stringify(playCounts)
        );

    }catch(error){

        /* ignorar */

    }

}


/* =========================================================
   UTILIDADES
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){
        return '0:00';
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2,'0');

    return `${minutes}:${secs}`;

}


const TRACK_IDS = {

    'tinkuy':
        'BVROS-TRK-PULSO-001',

    'subtle-gad':
        'BVROS-TRK-PULSO-002',

    'regresion':
        'BVROS-TRK-PULSO-003',

    'raiz-de-mi-ser':
        'BVROS-TRK-RAIZ-004'

};


function trackIdFor(slug){

    return TRACK_IDS[slug] || slug;

}


function getCachedDuration(slug){

    const raw =
        localStorage.getItem(
            `bvros_dur_${trackIdFor(slug)}`
        );

    if(!raw) return null;

    const num =
        Number(raw);

    return (
        Number.isFinite(num) && num > 0
    )
        ? num
        : null;

}


/* Esperar al reproductor global (blindaje anti-carrera) */

function waitForPlayer(timeoutMs = 5000){

    return new Promise(resolve => {

        if(window.BVrosPlayer){
            resolve(window.BVrosPlayer);
            return;
        }

        const timer =
            setTimeout(() => {

                cleanup();

                resolve(
                    window.BVrosPlayer || null
                );

            }, timeoutMs);

        function onReady(){
            cleanup();
            resolve(
                window.BVrosPlayer || null
            );
        }

        function cleanup(){
            clearTimeout(timer);
            window.removeEventListener(
                'bvros:playerready',
                onReady
            );
        }

        window.addEventListener(
            'bvros:playerready',
            onReady
        );

    });

}


/* =========================================================
   PLAYS DE LA LISTA
========================================================= */

function updateRowPlays(slug, value){

    const cell =
        list.querySelector(
            `[data-plays="${slug}"]`
        );

    if(cell){
        cell.textContent = value;
    }

}


/* Se llama DESPUÉS de renderizar: nunca bloquea. */

async function refreshPlayCounts(){

    for(const track of tracks){

        try{

            const total =
                await analyticsService.getPlayCount(
                    trackIdFor(track.slug)
                );

            playCounts[track.slug] = total;

            updateRowPlays(
                track.slug,
                total
            );

        }catch(error){

            /* se conserva caché de nube */

        }

    }

    saveCloudCache();

}


/* =========================================================
   CARGAR CATÁLOGO
========================================================= */

const CATALOG_PATHS = [
    'assets/data/catalog.json',
    'assets/data/catalogo.json'
];


async function load(){

    /* FIX-5 · el panel se consulta EN PARALELO con el
       catálogo estático (antes esperaba a que todo lo
       demás terminara: por eso la portada y la pista
       tardaban en aparecer). La llamada de más abajo
       reutiliza la misma promesa, sin duplicar. */

    cargarPistasDelPanel();

    try{

        let response = null;

        let pathUsed = null;

        const tried = [];


        for(const path of CATALOG_PATHS){

            try{

                const r =
                    await fetch(
                        path,
                        { cache: 'no-store' }
                    );

                if(r.ok){
                    response = r;
                    pathUsed = path;
                    break;
                }

                tried.push(
                    `${path} (HTTP ${r.status})`
                );

            }catch(pathError){

                tried.push(
                    `${path} (${pathError.message})`
                );

            }

        }


        if(!response){

            throw new Error(
                'No se encontró el catálogo. Probé: ' +
                tried.join(', ')
            );

        }


        console.info(
            '[BVros] Catálogo cargado desde ' + pathUsed
        );


        tracks =
            await response.json();


        /* Render inmediato con caché de nube:
           nunca se queda en "Cargando...". */

        renderTracks();


        refreshPlayCounts();


        /* El reproductor global recibe el catálogo
           para anterior/siguiente/autoplay. */

        const p =
            await waitForPlayer();

        if(p){
            p.setTracks(tracks);


            /* Si el global ya estaba reproduciendo,
               marcar esa fila como activa. */

            if(p.currentSlug){

                const idx =
                    tracks.findIndex(
                        t => t.slug === p.currentSlug
                    );

                if(idx >= 0){
                    currentIndex = idx;
                    currentSlug = p.currentSlug;
                    updateActiveRow();
                }

            }

        }

        /* PCD-2 · Fusiona ARRIBA las pistas publicadas
           desde el panel del dueño (si las hay). */

        cargarPistasDelPanel();

    }catch(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty-catalog">
                Error al cargar el catálogo.<br>
                ${error.message}
            </div>
        `;

        /* PCD-2 · aunque el catálogo estático falle,
           intenta mostrar lo publicado desde el panel. */

        cargarPistasDelPanel();

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderTracks(){

    if(!tracks.length){

        list.innerHTML = `
            <div class="empty-catalog">
                No hay pistas disponibles.
            </div>
        `;

        return;
    }


    list.innerHTML =
        tracks.map((track,index)=>{

            const liked =
                analyticsService.isLiked(
                    trackIdFor(track.slug)
                );

            const plays =
                playCounts[track.slug] || 0;

            const cachedDur =
                getCachedDuration(track.slug);

            const durationText =
                cachedDur !== null
                    ? formatTime(cachedDur)
                    : (track.duration || '--:--');

            /* PCD-2 · chip de panel: nivel o precio,
               con candado si el usuario no tiene el nivel. */

            const badge = track.dbTrack
                ? `<span class="track-badge ${nivelPermite(track.nivel) ? '' : 'lock'}">${
                    nivelPermite(track.nivel)
                        ? 'PANEL'
                        : '🔒 ' + nivelEtiqueta(track.nivel)
                    }${track.precio > 0 && !nivelPermite(track.nivel) ? ' · $' + track.precio.toFixed(2) : ''}</span>`
                : '';

            return `

                <div
                    class="track-row"
                    data-index="${index}"
                    ${track.dbTrack && track.src ? `data-secure-audio="${track.src}"` : ''}
                    ${track.dbTrack ? `data-track-id="${track.panelCode || track.panelId}"` : ''}
                >

                    <div class="track-num">
                        ${String(index + 1).padStart(2,'0')}
                    </div>


                    <img
                        class="track-cover"
                        src="${track.cover || ''}"
                        alt=""
                    >


                    <div class="track-main">

                        <div class="track-title">
                            ${track.title || 'Sin título'}${badge}
                        </div>

                        <div class="track-artist">
                            ${track.artist || 'BVros'}
                        </div>

                    </div>


                    <div class="track-album">
                        ${track.album || ''}
                    </div>


                    <div
                        class="track-dur"
                        data-duration="${track.slug}"
                    >
                        ${durationText}
                    </div>


                    <div
                        class="track-plays"
                        data-plays="${track.slug}"
                    >
                        ${plays}
                    </div>


                    <button
                        class="track-like ${liked ? 'liked' : ''}"
                        data-like="${track.slug}"
                        type="button"
                        title="Me gusta"
                    >
                        ${liked ? '♥' : '♡'}
                    </button>

                </div>

            `;

        }).join('');


    list
        .querySelectorAll('.track-row')
        .forEach(row => {

            row.addEventListener(
                'click',
                event => {

                    if(
                        event.target.closest(
                            '.track-like'
                        )
                    ){
                        return;
                    }

                    const index =
                        Number(
                            row.dataset.index
                        );

                    play(index);

                }
            );

        });


    list
        .querySelectorAll('.track-like')
        .forEach(button => {

            button.addEventListener(
                'click',
                async event => {

                    event.stopPropagation();

                    const slug =
                        button.dataset.like;

                    button.disabled = true;

                    try{

                        const newValue =
                            await analyticsService.toggleLike(
                                trackIdFor(slug)
                            );

                        button.classList.toggle(
                            'liked',
                            newValue
                        );

                        button.textContent =
                            newValue ? '♥' : '♡';

                        if(
                            window.BVrosPlayer &&
                            window.BVrosPlayer.currentSlug === slug
                        ){
                            window.BVrosPlayer.refreshLikeUI();
                        }

                    }finally{

                        button.disabled = false;

                    }

                }
            );

        });

}


/* =========================================================
   FILA ACTIVA
========================================================= */

function updateActiveRow(){

    list
        .querySelectorAll('.track-row')
        .forEach(row => {

            const index =
                Number(row.dataset.index);

            row.classList.toggle(
                'active',
                index === currentIndex
            );

        });

}


/* =========================================================
   PCD-2 · PISTAS DEL PANEL: NIVEL + PREVISUALIZACIÓN
   El nivel del usuario sale de su sesión (BVrosAuth):
   nivel1 → gratuito · nivel2/nivel2_promo → experto ·
   nivel3 → avanzado · promo → promo.
========================================================= */

const PCD_CFG =
    window.BVROS_CONFIG_OVERRIDE ||
    window.BVROS_CONFIG ||
    {};

const PCD_URL =
    (PCD_CFG.supabaseUrl || '').replace(/\/+$/, '');

const PCD_KEY =
    PCD_CFG.supabaseAnonKey || '';


function rankNivel(nivel){

    switch(String(nivel || '').toLowerCase()){

        case 'experto': return 1;
        case 'promo': return 1;
        case 'avanzado': return 2;
        default: return 0; /* gratuito */

    }

}


function nivelDeUsuario(){

    const auth =
        window.BVrosAuth;

    if(!auth || !auth.isAuthenticated || !auth.isAuthenticated()){
        return 'gratuito';
    }

    const p = auth.profile || {};

    const tier = String(
        p.subscription_tier ||
        (p.plan === 'premium'
            ? (p.profile_type === 'perfil2' ? 'nivel3' : 'nivel2')
            : 'nivel1')
    ).toLowerCase();

    if(tier === 'nivel3' || tier === 'avanzado') return 'avanzado';
    if(tier === 'nivel2' || tier === 'nivel2_promo' || tier === 'experto' || tier === 'promo') return 'experto';
    return 'gratuito';

}


function nivelPermite(nivelTrack){

    return rankNivel(nivelDeUsuario()) >= rankNivel(nivelTrack);

}


/* FIX-5 · NIVEL FRESCO: si la caché del navegador dice
   "bloqueado", se refresca el perfil DESDE LA BASE DE
   DATOS antes de decidir. Así, cuando subes de nivel
   (experto / avanzado / promo), el cambio se respeta
   AL INSTANTE, sin recargar la página: no hay
   previsualización ni cartel de compra para quien ya
   pagó. Si la caché ya autoriza, ni se consulta (0
   latencia extra). */

async function nivelPermiteFresco(track){

    if(nivelPermite(track.nivel)){
        return true;
    }

    const auth =
        window.BVrosAuth;

    if(
        auth &&
        auth.isAuthenticated &&
        auth.isAuthenticated() &&
        typeof auth.refreshProfile === 'function'
    ){

        try{
            await auth.refreshProfile();
        }catch(_){
            /* se decide con el perfil disponible */
        }

        return nivelPermite(track.nivel);

    }

    return false;

}


function nivelEtiqueta(nivel){

    return {
        gratuito: 'GRATUITO',
        experto: 'EXPERTO',
        avanzado: 'AVANZADO',
        promo: 'PROMO ESPECIAL'
    }[String(nivel || '').toLowerCase()] || 'EXCLUSIVO';

}


/* Mini-reproductor de previsualización:
   corta el audio a los segundos configurados y
   despliega el aviso de pago. El reproductor global
   NO se toca (sigue siendo el único para el catálogo). */

let previewAudio = null;

function cerrarPreview(){

    if(previewAudio){
        try{ previewAudio.pause(); }catch(_){}
        previewAudio = null;
    }

    const bar =
        document.getElementById('bvPreviewBar');

    if(bar){
        bar.style.display = 'none';
    }

}


function abrirVistaPanel(track){

    cerrarPreview();

    let bar =
        document.getElementById('bvPreviewBar');

    if(!bar){

        bar = document.createElement('div');

        bar.id = 'bvPreviewBar';

        bar.className = 'bv-preview-bar';

        document.body.appendChild(bar);

    }

    const puedePreview =
        !!track.src &&
        Number(track.previewSeg || 0) > 0;

    if(puedePreview){

        const corte =
            Number(track.previewSeg);

        previewAudio =
            new Audio(track.src);

        previewAudio.addEventListener(
            'timeupdate',
            () => {

                if(
                    previewAudio &&
                    previewAudio.currentTime >= corte
                ){

                    previewAudio.pause();

                    previewAudio.currentTime = 0;

                    pintarAvisoPago(bar, track, true);

                }

            }
        );

        previewAudio.play().catch(() => {});

        bar.innerHTML = `
            <div class="t">PREVISUALIZACIÓN · ${corte}s</div>
            <div class="m">${track.title} — ${track.artist}</div>
            <div class="m">Necesitas <b>${nivelEtiqueta(track.nivel)}</b>${track.precio > 0 ? ` o comprarla ($${track.precio.toFixed(2)})` : ''} para escucharla completa.</div>
            <div class="row">
                <button type="button" data-cta>OBTENER ACCESO</button>
                <button type="button" class="sec" data-close>CERRAR</button>
            </div>
        `;

    }else{

        pintarAvisoPago(bar, track, false);

    }

    bar.style.display = 'block';

    const cta =
        bar.querySelector('[data-cta]');

    if(cta){

        cta.addEventListener('click', () => {

            cerrarPreview();

            if(window.BVrosGate && window.BVrosGate.open){
                window.BVrosGate.open('suscripcion');
            }else{
                window.location.href = 'index.html';
            }

        });

    }

    const close =
        bar.querySelector('[data-close]');

    if(close){
        close.addEventListener('click', cerrarPreview);
    }

}


function pintarAvisoPago(bar, track, conPreview){

    bar.innerHTML = `
        <div class="t">CONTENIDO ${nivelEtiqueta(track.nivel)}</div>
        <div class="m">${track.title} — ${track.artist}</div>
        <div class="m">${conPreview ? 'Fin de la previsualización. ' : 'Este contenido está bloqueado para tu nivel actual. '}Obtén <b>${nivelEtiqueta(track.nivel)}</b>${track.precio > 0 ? ` o cómprala por $${track.precio.toFixed(2)}` : ''} para escucharla completa.</div>
        <div class="row">
            <button type="button" data-cta>OBTENER ACCESO</button>
            <button type="button" class="sec" data-close>CERRAR</button>
        </div>
    `;

    const cta =
        bar.querySelector('[data-cta]');

    if(cta){

        cta.addEventListener('click', () => {

            cerrarPreview();

            if(window.BVrosGate && window.BVrosGate.open){
                window.BVrosGate.open('suscripcion');
            }else{
                window.location.href = 'index.html';
            }

        });

    }

    const close =
        bar.querySelector('[data-close]');

    if(close){
        close.addEventListener('click', cerrarPreview);
    }

}


/* =========================================================
   DURACIÓN REAL · PISTAS DEL PANEL (sin tocar player.js)
   La función bvlux-catalogo entrega duracion:"--:--"
   (un servidor no puede medir el MP3), por eso las
   pistas del panel salían con --:--- mientras las
   estáticas muestran su tiempo escrito a mano.
   Aquí se lee la duración REAL del propio archivo:
   se usa DIRECTAMENTE la URL firmada (3600s) que el
   panel ya entrega en cada pista (la misma que suena
   en la previsualización) y se leen sus metadatos.
   Sin imports externos: así nunca depende de rutas
   relativas de otros archivos. Al terminar se guarda
   en la misma caché
   que ya usa el sitio (bvros_dur_*) y se pinta en la
   tarjeta (3:32, etc.). Sirve para TODAS las pistas
   futuras que subas desde el panel.
========================================================= */

console.info(
    '[BVros Stream] duración real del panel ACTIVA'
);

async function completarDuracionesPanel(){

    for(const track of tracks){

        /* solo pistas publicadas desde el panel */
        if(!track.dbTrack) continue;

        /* sin URL firmada, en sondéo o ya conocida */
        if(!track.src) continue;
        if(track.probeDur) continue;
        if(getCachedDuration(track.slug) !== null){
            continue;
        }

        track.probeDur = true;

        try{

            /* elemento suelto (no interfiere con el
               reproductor global): solo metadatos,
               con la URL que YA trae la pista. */
            const probe = new Audio();

            probe.preload = 'metadata';

            probe.src = track.src;

            const segundos =
                await new Promise((resolver, fallar) => {

                    const tiempo =
                        setTimeout(() => {
                            fallar(
                                new Error('tiempo agotado')
                            );
                        }, 12000);

                    probe.addEventListener(
                        'loadedmetadata',
                        () => {
                            clearTimeout(tiempo);
                            resolver(probe.duration);
                        },
                        { once: true }
                    );

                    probe.addEventListener(
                        'error',
                        () => {
                            clearTimeout(tiempo);
                            fallar(
                                new Error('sin metadatos')
                            );
                        },
                        { once: true }
                    );

                });

            if(
                Number.isFinite(segundos) &&
                segundos > 0
            ){

                /* misma caché que usa el listado y el
                   reproductor (bvros_dur_<id>) */
                try{
                    localStorage.setItem(
                        'bvros_dur_' +
                            trackIdFor(track.slug),
                        String(segundos)
                    );
                }catch(_){
                    /* sin espacio: solo se pinta */
                }

                const celda =
                    list.querySelector(
                        `[data-duration="${track.slug}"]`
                    );

                if(celda){
                    celda.textContent =
                        formatTime(segundos);
                }

            }

        }catch(_){
            /* silencioso: la tarjeta conserva "--:--"
               y se llenará al reproducir (mecanismo
               bvros:playerduration ya existente). */
        }

    }

}


/* Fusiona ARRIBA del listado las pistas publicadas
   desde el panel (bvlux-catalogo · acción "publico").
   ADITIVO y a prueba de fallos: si algo falla, el
   catálogo estático queda exactamente igual. */

/* FIX-5 · dedupe: la carga del panel se lanza en
   PARALELO desde load() y cualquier llamada extra
   reutiliza la MISMA promesa (nunca se fusiona dos
   veces ni se consulta dos veces la función). */

let panelPromesa = null;

function cargarPistasDelPanel(){

    if(!panelPromesa){
        panelPromesa = fusionarPistasDelPanel();
    }

    return panelPromesa;

}

async function fusionarPistasDelPanel(){

    if(!PCD_URL || !PCD_KEY) return;

    try{

        let data = null;

        /* FIX-5 · caché de sesión (10 minutos; las URL
           firmadas viven 3600s): al volver a la página,
           las pistas del panel y sus portadas aparecen
           AL INSTANTE, sin esperar a la función. */
        try{

            const cruda =
                sessionStorage.getItem(
                    'bvros_panel_publico_v1'
                );

            if(cruda){

                const cache = JSON.parse(cruda);

                if(
                    cache && cache.t &&
                    (Date.now() - cache.t) <
                        10 * 60 * 1000 &&
                    cache.data
                ){
                    data = cache.data;
                }

            }

        }catch(_){ /* caché inválida: se ignora */ }

        if(!data){

            const res =
                await fetch(
                    PCD_URL + '/functions/v1/bvlux-catalogo',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json',
                            apikey: PCD_KEY,
                            Authorization: 'Bearer ' + PCD_KEY
                        },

                        body: JSON.stringify({
                            accion: 'publico',
                            tipo: 'musica',
                            destino: 'stream',

                            /* FIX-1: el catálogo estático ya tiene
                               estas pistas — se envían sus códigos y
                               slugs para que el panel NO las
                               duplique arriba del listado. */
                            excluir_codes: Object.values(TRACK_IDS),
                            excluir_slugs: Object.keys(TRACK_IDS)
                        })
                    }
                );

            if(!res.ok){
                throw new Error('HTTP ' + res.status);
            }

            data =
                await res.json();

            try{
                sessionStorage.setItem(
                    'bvros_panel_publico_v1',
                    JSON.stringify({
                        t: Date.now(),
                        data
                    })
                );
            }catch(_){
                /* sin espacio: simplemente sin caché */
            }

        }

        if(!data.ok || !Array.isArray(data.items)){
            return;
        }

        const delPanel =
            data.items
                .filter(i => i.tipo === 'musica')
                .map(i => ({

                    slug:
                        i.slug || ('db-' + i.id),

                    /* FIX-5 · id con el CÓDIGO REAL de la
                       pista: el reproductor global resuelve
                       el audio con track.id PRIMERO (y luego
                       trackIdFor(slug)). Sin esto enviaba el
                       slug ("apropiado") y get-audio-url
                       respondía 404 · track no encontrado. */
                    id:
                        i.track_code || undefined,

                    title:
                        i.titulo || 'Sin título',

                    artist:
                        i.artista || 'BVHanKrY',

                    album:
                        i.album || '',

                    cover:
                        i.cover_url || '',

                    duration:
                        i.duracion || '--:--',

                    dbTrack: true,

                    panelId:
                        i.id,

                    /* FIX-1: código real de la pista
                       (BVROS-TRK-XXX-NNN) — el mismo sistema
                       de get-audio-url que el catálogo
                       estático. */
                    panelCode:
                        i.track_code || '',

                    nivel:
                        i.nivel || 'gratuito',

                    precio:
                        Number(i.precio || 0),

                    previewSeg:
                        i.preview_seg == null
                            ? 15
                            : Number(i.preview_seg),

                    src:
                        i.audio_url || ''

                }));

        if(!delPanel.length){
            return;
        }

        /* LAS MÁS NUEVAS ARRIBA: el panel las entrega de
           más nueva a más vieja; van primero del listado,
           antes del catálogo estático. */

        tracks =
            [...delPanel, ...tracks];

        renderTracks();

        refreshPlayCounts();

        /* duración real en cada tarjeta (no bloquea) */
        completarDuracionesPanel();

        const p =
            await waitForPlayer();

        if(p){
            p.setTracks(tracks);
        }

        console.info(
            '[BVros] ' + delPanel.length +
            ' pista(s) del panel fusionadas arriba del catálogo.'
        );

    }catch(error){

        console.warn(
            '[BVros] pistas del panel no disponibles:',
            error && error.message
                ? error.message
                : error
        );

    }

}


/* =========================================================
   REPRODUCIR — delegación al reproductor global
========================================================= */

async function play(index){

    const track =
        tracks[index];

    if(!track){
        return;
    }

    /* NIVEL 1 · PCD-2: pista del panel con nivel mayor
       al del usuario → interfaz de previsualización o
       aviso de pago. El bloqueo se respeta SIEMPRE. */

    if(
        track.dbTrack &&
        !(await nivelPermiteFresco(track))
    ){

        abrirVistaPanel(track);

        return;

    }

    /* FIX-5 · si el nivel ya permite la pista, el aviso
       de compra viejo se retira al reproducir. */
    cerrarPreview();

    currentIndex =
        index;

    currentSlug =
        track.slug;


    updateActiveRow();


    const p =
        await waitForPlayer();


    if(!p){

        console.error(
            '[BVros Stream] Reproductor global no disponible.'
        );

        return;

    }


    p.setTracks(tracks);

    p.playTrack(
        track.slug,
        tracks
    );

}


/* =========================================================
   SINCRONIZACIÓN CON EL REPRODUCTOR GLOBAL
========================================================= */

window.addEventListener(
    'bvros:playertrack',
    event => {

        const { slug } =
            event.detail || {};

        if(!slug || !tracks.length) return;

        const idx =
            tracks.findIndex(
                t => t.slug === slug
            );

        if(idx >= 0){
            currentIndex = idx;
            currentSlug = slug;
            updateActiveRow();
        }

    }
);


window.addEventListener(
    'bvros:playregistered',
    event => {

        const { slug, total } =
            event.detail || {};

        if(!slug) return;

        playCounts[slug] =
            total;

        saveCloudCache();

        updateRowPlays(
            slug,
            total
        );

    }
);


window.addEventListener(
    'bvros:playerliked',
    event => {

        const { slug, liked } =
            event.detail || {};

        if(!slug) return;

        const rowButton =
            list.querySelector(
                `[data-like="${slug}"]`
            );

        if(rowButton){

            rowButton.classList.toggle(
                'liked',
                liked
            );

            rowButton.textContent =
                liked ? '♥' : '♡';

        }

    }
);


window.addEventListener(
    'bvros:playerduration',
    event => {

        const { slug, text } =
            event.detail || {};

        if(!slug || !text) return;

        const cell =
            list.querySelector(
                `[data-duration="${slug}"]`
            );

        if(cell){
            cell.textContent = text;
        }

    }
);


/* =========================================================
   INICIALIZAR
========================================================= */

load();

</script>
